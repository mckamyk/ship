<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594" role="img" aria-label="Diagram of how ship creates, moves and deletes its staging, prod and infra tags over an example run"><style>
svg{--bg:#ffffff;--border:#d0d7de;--grid:#eaeef2;--fg:#1f2328;--muted:#656d76;--line:#57606a;
--staging:#9a6700;--staging-bg:#fff8c5;--prod:#1a7f37;--prod-bg:#dafbe1;--infra:#8250df;--infra-bg:#fbefff}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--border:#30363d;--grid:#21262d;--fg:#e6edf3;--muted:#8d96a0;--line:#8b949e;
--staging:#d29922;--staging-bg:#2e2410;--prod:#3fb950;--prod-bg:#11281a;--infra:#a371f7;--infra-bg:#24193f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
.title{font-size:18px;font-weight:600}.sub{font-size:13px;fill:var(--muted)}
.note{font-size:11.5px;fill:var(--muted)}.small{font-size:11px;fill:var(--muted)}
.cap{font-size:11.5px;fill:var(--fg)}
</style><rect x=".5" y=".5" width="999" height="593" rx="10" style="fill:var(--bg)" stroke="var(--border)"/><text class="title" x="24" y="38">How ship moves its tags</text><text class="sub" x="24" y="60">One example run, left to right. Each row is a tag on origin; the label above a marker is the commit it points at.</text><circle cx="300.0" cy="92" r="11" style="fill:var(--fg)"/><text x="300.0" y="96.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--bg)">1</text><text class="cap" x="300.0" y="122" text-anchor="middle">checkout-flow</text><text class="cap" x="300.0" y="137" text-anchor="middle">→ staging</text><circle cx="400.0" cy="92" r="11" style="fill:var(--fg)"/><text x="400.0" y="96.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--bg)">2</text><text class="cap" x="400.0" y="122" text-anchor="middle">search-bar</text><text class="cap" x="400.0" y="137" text-anchor="middle">→ staging</text><circle cx="500.0" cy="92" r="11" style="fill:var(--fg)"/><text x="500.0" y="96.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--bg)">3</text><text class="cap" x="500.0" y="122" text-anchor="middle">checkout-flow</text><text class="cap" x="500.0" y="137" text-anchor="middle">→ staging again</text><text class="cap" x="500.0" y="152" text-anchor="middle">(new commit)</text><circle cx="600.0" cy="92" r="11" style="fill:var(--fg)"/><text x="600.0" y="96.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--bg)">4</text><text class="cap" x="600.0" y="122" text-anchor="middle">checkout-flow</text><text class="cap" x="600.0" y="137" text-anchor="middle">→ production</text><circle cx="700.0" cy="92" r="11" style="fill:var(--fg)"/><text x="700.0" y="96.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--bg)">5</text><text class="cap" x="700.0" y="122" text-anchor="middle">Finish infra</text><text class="cap" x="700.0" y="137" text-anchor="middle">split-vpc, then</text><text class="cap" x="700.0" y="152" text-anchor="middle">rebuild staging</text><circle cx="800.0" cy="92" r="11" style="fill:var(--fg)"/><text x="800.0" y="96.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--bg)">6</text><text class="cap" x="800.0" y="122" text-anchor="middle">Bring missing</text><text class="cap" x="800.0" y="137" text-anchor="middle">infra to dev</text><circle cx="900.0" cy="92" r="11" style="fill:var(--fg)"/><text x="900.0" y="96.5" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--bg)">7</text><text class="cap" x="900.0" y="122" text-anchor="middle">Remove</text><text class="cap" x="900.0" y="137" text-anchor="middle">search-bar</text><text class="cap" x="900.0" y="152" text-anchor="middle">from staging</text><line x1="300.0" y1="160" x2="300.0" y2="512" stroke="var(--grid)" stroke-width="1.5"/><line x1="400.0" y1="160" x2="400.0" y2="512" stroke="var(--grid)" stroke-width="1.5"/><line x1="500.0" y1="160" x2="500.0" y2="512" stroke="var(--grid)" stroke-width="1.5"/><line x1="600.0" y1="160" x2="600.0" y2="512" stroke="var(--grid)" stroke-width="1.5"/><line x1="700.0" y1="160" x2="700.0" y2="512" stroke="var(--grid)" stroke-width="1.5"/><line x1="800.0" y1="160" x2="800.0" y2="512" stroke="var(--grid)" stroke-width="1.5"/><line x1="900.0" y1="160" x2="900.0" y2="512" stroke="var(--grid)" stroke-width="1.5"/><rect x="24" y="167" width="175.6" height="22" rx="5" style="fill:var(--staging-bg)" stroke="var(--staging)" stroke-opacity=".45"/><text class="mono" x="32" y="182.3" font-size="12.5" style="fill:var(--staging)" font-weight="600">staging/checkout-flow</text><line x1="300.0" y1="178" x2="600.0" y2="178" stroke="var(--staging)" stroke-width="3" stroke-linecap="round" opacity=".55"/><circle cx="300.0" cy="178" r="6.5" style="fill:var(--staging)"/><text class="mono small" x="300.0" y="167" text-anchor="middle">A1</text><circle cx="500.0" cy="178" r="6.5" style="fill:var(--bg)" stroke="var(--staging)" stroke-width="2.6"/><text class="mono small" x="500.0" y="167" text-anchor="middle">A2</text><path d="M594.5 172.5 L605.5 183.5 M605.5 172.5 L594.5 183.5" stroke="var(--staging)" stroke-width="2.6" stroke-linecap="round"/><rect x="24" y="207" width="152.79999999999998" height="22" rx="5" style="fill:var(--staging-bg)" stroke="var(--staging)" stroke-opacity=".45"/><text class="mono" x="32" y="222.3" font-size="12.5" style="fill:var(--staging)" font-weight="600">staging/search-bar</text><line x1="400.0" y1="218" x2="900.0" y2="218" stroke="var(--staging)" stroke-width="3" stroke-linecap="round" opacity=".55"/><circle cx="400.0" cy="218" r="6.5" style="fill:var(--staging)"/><text class="mono small" x="400.0" y="207" text-anchor="middle">S1</text><path d="M894.5 212.5 L905.5 223.5 M905.5 212.5 L894.5 223.5" stroke="var(--staging)" stroke-width="2.6" stroke-linecap="round"/><rect x="24" y="261" width="99.6" height="22" rx="5" style="fill:var(--prod-bg)" stroke="var(--prod)" stroke-opacity=".45"/><text class="mono" x="32" y="276.3" font-size="12.5" style="fill:var(--prod)" font-weight="600">prod/latest</text><line x1="600.0" y1="272" x2="976" y2="272" stroke="var(--prod)" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M969 267 L977 272 L969 277" fill="none" stroke="var(--prod)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><circle cx="600.0" cy="272" r="6.5" style="fill:var(--prod)"/><text class="mono small" x="600.0" y="261" text-anchor="middle">M1</text><circle cx="700.0" cy="272" r="6.5" style="fill:var(--bg)" stroke="var(--prod)" stroke-width="2.6"/><text class="mono small" x="700.0" y="261" text-anchor="middle">M2</text><rect x="24" y="301" width="152.79999999999998" height="22" rx="5" style="fill:var(--prod-bg)" stroke="var(--prod)" stroke-opacity=".45"/><text class="mono" x="32" y="316.3" font-size="12.5" style="fill:var(--prod)" font-weight="600">prod/checkout-flow</text><line x1="600.0" y1="312" x2="976" y2="312" stroke="var(--prod)" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M969 307 L977 312 L969 317" fill="none" stroke="var(--prod)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><circle cx="600.0" cy="312" r="6.5" style="fill:var(--prod)"/><text class="mono small" x="600.0" y="301" text-anchor="middle">M1</text><rect x="24" y="341" width="122.39999999999999" height="22" rx="5" style="fill:var(--prod-bg)" stroke="var(--prod)" stroke-opacity=".45"/><text class="mono" x="32" y="356.3" font-size="12.5" style="fill:var(--prod)" font-weight="600">prod/split-vpc</text><line x1="700.0" y1="352" x2="976" y2="352" stroke="var(--prod)" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M969 347 L977 352 L969 357" fill="none" stroke="var(--prod)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><circle cx="700.0" cy="352" r="6.5" style="fill:var(--prod)"/><text class="mono small" x="700.0" y="341" text-anchor="middle">M2</text><rect x="24" y="395" width="168.0" height="22" rx="5" style="fill:var(--infra-bg)" stroke="var(--infra)" stroke-opacity=".45"/><text class="mono" x="32" y="410.3" font-size="12.5" style="fill:var(--infra)" font-weight="600">infra/prod/split-vpc</text><line x1="700.0" y1="406" x2="976" y2="406" stroke="var(--infra)" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M969 401 L977 406 L969 411" fill="none" stroke="var(--infra)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><circle cx="700.0" cy="406" r="6.5" style="fill:var(--infra)"/><text class="mono small" x="700.0" y="395" text-anchor="middle">M2</text><rect x="24" y="435" width="190.79999999999998" height="22" rx="5" style="fill:var(--infra-bg)" stroke="var(--infra)" stroke-opacity=".45"/><text class="mono" x="32" y="450.3" font-size="12.5" style="fill:var(--infra)" font-weight="600">infra/staging/split-vpc</text><line x1="700.0" y1="446" x2="976" y2="446" stroke="var(--infra)" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M969 441 L977 446 L969 451" fill="none" stroke="var(--infra)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><circle cx="700.0" cy="446" r="6.5" style="fill:var(--infra)"/><text class="mono small" x="700.0" y="435" text-anchor="middle">M2</text><rect x="24" y="475" width="160.4" height="22" rx="5" style="fill:var(--infra-bg)" stroke="var(--infra)" stroke-opacity=".45"/><text class="mono" x="32" y="490.3" font-size="12.5" style="fill:var(--infra)" font-weight="600">infra/dev/split-vpc</text><line x1="800.0" y1="486" x2="976" y2="486" stroke="var(--infra)" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M969 481 L977 486 L969 491" fill="none" stroke="var(--infra)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><circle cx="800.0" cy="486" r="6.5" style="fill:var(--infra)"/><text class="mono small" x="800.0" y="475" text-anchor="middle">M2</text><line x1="24" y1="526" x2="976" y2="526" stroke="var(--border)"/><circle cx="30" cy="546" r="6" style="fill:var(--line)"/><text class="note" x="44" y="550">created</text><circle cx="106.19999999999999" cy="546" r="6" style="fill:var(--bg)" stroke="var(--line)" stroke-width="2.4"/><text class="note" x="120.19999999999999" y="550">moved to a newer commit</text><path d="M283.0 541 L293.0 551 M293.0 541 L283.0 551" stroke="var(--line)" stroke-width="2.4" stroke-linecap="round"/><text class="note" x="302.0" y="550">deleted</text><path d="M359.2 541 L367.2 546 L359.2 551" fill="none" stroke="var(--line)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text class="note" x="378.2" y="550">still there</text><text class="note" x="24" y="574">A1, A2: commits on ship/checkout-flow · S1: ship/search-bar · M1, M2: the squash commits on main. Tags only change after a deploy succeeds.</text></svg>
