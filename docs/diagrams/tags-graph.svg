<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="486" viewBox="0 0 1040 486" role="img" aria-label="Git graph showing which commits ship&#x27;s staging, prod and infra tags point at"><style>
svg{--bg:#ffffff;--border:#d0d7de;--grid:#eaeef2;--fg:#1f2328;--muted:#656d76;--line:#57606a;
--staging:#9a6700;--staging-bg:#fff8c5;--prod:#1a7f37;--prod-bg:#dafbe1;--infra:#8250df;--infra-bg:#fbefff}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--border:#30363d;--grid:#21262d;--fg:#e6edf3;--muted:#8d96a0;--line:#8b949e;
--staging:#d29922;--staging-bg:#2e2410;--prod:#3fb950;--prod-bg:#11281a;--infra:#a371f7;--infra-bg:#24193f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
.title{font-size:18px;font-weight:600}.sub{font-size:13px;fill:var(--muted)}
.note{font-size:11.5px;fill:var(--muted)}.small{font-size:11px;fill:var(--muted)}
.cap{font-size:11.5px;fill:var(--fg)}
</style><rect x=".5" y=".5" width="1039" height="485" rx="10" style="fill:var(--bg)" stroke="var(--border)"/><text class="title" x="24" y="38">Where the tags point</text><text class="sub" x="24" y="60">After checkout-flow and the split-vpc Infrastructure Change reached production, with search-bar still on staging.</text><text class="mono" x="24" y="127" font-size="12.5" font-weight="600">staging</text><text class="small" x="24" y="142">branch, rebuilt each time</text><text class="mono" x="24" y="195" font-size="12.5" font-weight="600">ship/search-bar</text><text class="small" x="24" y="210">Staged Feature</text><text class="mono" x="24" y="275" font-size="12.5" font-weight="600">main</text><text class="small" x="24" y="290">matches production</text><text class="mono" x="24" y="355" font-size="12.5" font-weight="600" opacity=".6">ship/checkout-flow</text><text class="small" x="24" y="370">deleted once shipped</text><text class="mono" x="24" y="425" font-size="12.5" font-weight="600" opacity=".6">infra/split-vpc</text><text class="small" x="24" y="440">deleted once shipped</text><path d="M172 276 L630 276" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round"/><path d="M210 276 C210 326, 230 356, 260 356 L370 356" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 4" opacity=".55"/><path d="M370 356 C420 356, 454 326, 456 296" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 4" opacity=".55"/><path d="M451 297 L456 290 L462 297" fill="none" stroke="var(--line)" stroke-width="2" opacity=".55"/><text class="small" x="408" y="342">squash</text><path d="M460 276 C460 396, 480 426, 505 426 L545 426" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 4" opacity=".55"/><path d="M545 426 C600 426, 624 386, 626 296" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 4" opacity=".55"/><path d="M621 297 L626 290 L632 297" fill="none" stroke="var(--line)" stroke-width="2" opacity=".